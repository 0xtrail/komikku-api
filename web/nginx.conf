server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the nginx version in the Server header or in any error body.
    server_tokens off;

    # Branded error pages instead of nginx's built-in ones. Astro emits them as
    # dist/404.html and dist/50x/index.html (directory format), see src/pages/.
    # 403 shares the 404 page: an unlisted directory such as /_astro/ is just "not there" to a visitor.
    error_page 403 404 /404.html;
    error_page 500 502 503 504 /50x/index.html;
    location = /404.html { internal; }
    location = /50x/index.html { internal; }

    # Hashed build assets never change, so they can be cached hard.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The static shell for /manga/<slug>/, /chapter/<slug>/, /genre/<slug>/,
    # /populer/ and /terbaru/. Cloudflare Pages uses public/_redirects for this;
    # nginx needs the rule spelled out.
    location ~ ^/(manga|chapter|genre|populer|terbaru)/ {
        try_files $uri /view/index.html;
    }

    # Everything else resolves to a real file or directory (/, /search/).
    # Anything that does not falls through to the 404 page above.
    location / {
        try_files $uri $uri/ =404;
    }
}
