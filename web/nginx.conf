server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets never change, so they can be cached hard.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The static shell for /manga/<slug>/ and /chapter/<slug>/. Cloudflare Pages
    # uses public/_redirects for this; nginx needs the rule spelled out.
    location ~ ^/(manga|chapter)/ {
        try_files $uri /view/index.html;
    }

    # Everything else resolves to a real file or directory (/, /search/).
    location / {
        try_files $uri $uri/ =404;
    }
}